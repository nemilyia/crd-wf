name: CI
on:
  workflow_dispatch:
    inputs:
      Code:
        description: 'Code'
        required: true

jobs:
  Run:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xbase-clients python3-psutil dbus-x11 git curl
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -O /tmp/crd.deb
          sudo apt-get install -y /tmp/crd.deb
          sudo groupadd -f chrome-remote-desktop
          sudo usermod -a -G chrome-remote-desktop runner
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          if [ ! -d "$HOME/swdtf" ]; then
            git clone https://gitlab.com/Viclia/swdtf.git "$HOME/swdtf"
          fi
          cd "$HOME/swdtf"
          nix run home-manager/master -- switch -b backup --flake .#runner
        shell: bash

      - name: Start
        run: |
          DISPLAY= /opt/google/chrome-remote-desktop/start-host --code="${{ github.event.inputs.Code }}" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$(hostname)" --pin=123123
          sudo systemctl restart chrome-remote-desktop@runner.service
          echo "runner:runner" | sudo chpasswd
        shell: bash

      - name: Sleep
        run: sleep 21600
        shell: bash
